<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Deep Listening Training</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: one calm column like a practice journal; tabs on top, one task per screen */
:root{
  --bg:#eef2f1; --surface:#ffffff; --ink:#1d2b2a; --muted:#5b6b69; --line:#d3dcda;
  --accent:#2f6b66; --accent-ink:#ffffff; --soft:#dfeae8; --warn:#8a5a1c; --warn-soft:#f4e9d8;
  --display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a19; --surface:#1a2524; --ink:#e3ecea; --muted:#9aaba8; --line:#2c3a38;
  --accent:#6fb7ae; --accent-ink:#0f1918; --soft:#21302e; --warn:#e2b273; --warn-soft:#2e261b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a19; --surface:#1a2524; --ink:#e3ecea; --muted:#9aaba8; --line:#2c3a38;
  --accent:#6fb7ae; --accent-ink:#0f1918; --soft:#21302e; --warn:#e2b273; --warn-soft:#2e261b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tools{display:flex;gap:8px;align-items:center}
h1{font-family:var(--display);font-weight:600;font-size:1.35rem;margin:0;letter-spacing:.01em}
h1 small{display:block;font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--muted)}
h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0;text-wrap:balance}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);padding:6px 14px;font:inherit;font-size:.85rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.voice{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.voice[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:12px}
nav button{border:0;background:transparent;color:var(--muted);padding:9px 6px;border-radius:9px;font:inherit;font-size:.92rem;cursor:pointer}
nav button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
label{display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--muted)}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost[aria-pressed="true"]{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);font-weight:500}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns .btn{flex:1 1 140px}
.note{font-size:.85rem;color:var(--muted);margin:0}
.say{font-family:var(--display);font-size:1.3rem;font-weight:500;line-height:1.45;margin:0;text-wrap:balance}
.replay{align-self:flex-start;border:0;background:transparent;color:var(--accent);font:inherit;font-size:.85rem;cursor:pointer;padding:0}
details.guide{border:1px dashed var(--line);border-radius:12px;padding:10px 14px}
details.guide summary{cursor:pointer;color:var(--accent);font-weight:500}
details.guide p{margin:10px 0 0}
.timer{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:8px}
.clock{font-family:var(--display);font-size:clamp(3.2rem,16vw,4.6rem);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.bar{width:100%;height:6px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width 1s linear}
.chip{display:inline-block;font-size:.78rem;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:500;white-space:nowrap}
.chip.bd{background:var(--warn-soft);color:var(--warn)}
.chip.ex{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.status{border-radius:12px;padding:12px 14px;background:var(--soft)}
.status.bd{background:var(--warn-soft)}
.status p{margin:0}
.steps{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:12px}
.entry{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.entry .head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.entry .when{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.entry dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem}
.entry dt{color:var(--muted)} .entry dd{margin:0;min-width:0;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.demo{flex-direction:row;align-items:center;gap:8px;font-size:.85rem}
.demo input{width:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;color:var(--muted);padding:9px 6px;border-radius:9px;font:inherit;font-size:.92rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600}
input[readonly]{color:var(--muted)}
.grid90{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:12px}
.box{aspect-ratio:1;border-radius:5px;display:grid;place-items:center;font-size:.62rem;font-variant-numeric:tabular-nums;border:1px solid transparent;min-width:0}
.box.ok{background:var(--accent);color:var(--accent-ink)}
.box.bdx{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.box.miss{border:1px dashed var(--muted);color:var(--muted)}
.box.fut{background:var(--bg);color:var(--muted);opacity:.7}
.box.now{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .box{width:14px;height:14px;display:inline-block;border-radius:4px}
@media (max-width:420px){.row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1><span data-t="appName"></span><small data-t="tagline"></small></h1>
    <div class="tools">
      <button class="voice" id="b-voice" type="button" aria-pressed="true"></button>
      <div class="lang" role="group" aria-label="Language">
        <button id="lang-th" type="button">ไทย</button>
        <button id="lang-en" type="button">EN</button>
      </div>
    </div>
  </div>

  <p class="status bd" id="voice-msg" hidden></p>
  <button class="replay" id="b-test-voice" type="button" data-t="testVoice"></button>

  <nav role="tablist">
    <button id="tab-today" role="tab" data-view="today" data-t="tabToday"></button>
    <button id="tab-history" role="tab" data-view="history" data-t="tabHistory"></button>
    <button id="tab-coach" role="tab" data-view="coach" data-t="tabCoach"></button>
    <button id="tab-tools" role="tab" data-view="tools" data-t="tabTools"></button>
  </nav>

  <!-- TODAY: welcome -->
  <section class="panel" id="v-welcome">
    <p class="say" data-t="welcome"></p>
    <button class="btn" id="b-welcome" type="button" data-t="letsBegin"></button>
  </section>

  <!-- TODAY: declare -->
  <section class="panel" id="v-declare" hidden>
    <p class="say" data-t="askActivity"></p>
    <button class="replay" id="b-replay-ask" type="button" data-t="replay"></button>
    <div class="seg" role="group">
      <button id="g-main" type="button" data-t="gMain"></button>
      <button id="g-extra" type="button" data-t="gExtra"></button>
    </div>
    <p class="note" id="g-note"></p>
    <label><span data-t="qActivity"></span><input id="f-activity" type="text"></label>
    <label id="l-min" hidden><span data-t="qMin"></span><input id="f-min" type="number" min="1" max="180" inputmode="numeric" value="30"></label>
    <div class="row">
      <label><span data-t="qStart"></span><input id="f-start" type="time"></label>
      <label><span data-t="qEnd"></span><input id="f-end" type="time" readonly></label>
    </div>
    <label><span data-t="qAlarm"></span><input id="f-alarm" type="time"></label>
    <div class="btns">
      <button class="btn ghost" id="b-declare" type="button" data-t="declare"></button>
      <button class="btn ghost" id="b-test-alarm" type="button" data-t="testAlarm"></button>
    </div>
    <div class="status" id="d-status" hidden><p id="d-status-text"></p></div>
    <p class="note" data-t="alarmNote"></p>
    <details class="guide" id="d-why">
      <summary data-t="whyTitle"></summary>
      <p data-t="why"></p>
      <button class="replay" id="b-why-say" type="button" data-t="listen"></button>
    </details>
    <details class="guide" id="d-guide">
      <summary data-t="guideTitle"></summary>
      <p data-t="guide"></p>
      <button class="replay" id="b-guide-say" type="button" data-t="listen"></button>
    </details>
    <label class="demo"><input id="f-demo" type="checkbox"><span data-t="demo"></span></label>
    <button class="btn" id="b-start" type="button" data-t="begin"></button>
  </section>

  <!-- TODAY: timer -->
  <section class="panel" id="v-timer" hidden>
    <div class="timer">
      <span class="chip" id="t-activity"></span>
      <div class="clock" id="t-clock">10:00</div>
      <div class="bar"><i id="t-bar"></i></div>
      <p class="note" id="t-note" data-t="timerNote"></p>
    </div>
    <button class="btn ghost" id="b-end" type="button" data-t="endNow"></button>
  </section>

  <!-- TODAY: reflect, one question at a time -->
  <section class="panel" id="v-reflect" hidden>
    <div class="status" id="r-status"><p id="r-status-text"></p></div>
    <span class="steps" id="r-steps"></span>
    <p class="say" id="r-q"></p>
    <button class="replay" id="b-replay-q" type="button" data-t="replay"></button>
    <textarea id="f-answer" aria-labelledby="r-q"></textarea>
    <button class="btn ghost" id="b-mic" type="button" aria-pressed="false"></button>
    <p class="note" id="mic-msg" hidden></p>
    <p class="note" data-t="voiceHint"></p>
    <div class="btns">
      <button class="btn ghost" id="b-prev" type="button" data-t="back"></button>
      <button class="btn" id="b-next" type="button"></button>
    </div>
  </section>

  <!-- TODAY: done -->
  <section class="panel" id="v-done" hidden>
    <p class="say" data-t="doneTitle"></p>
    <p class="note" data-t="doneNote"></p>
    <button class="btn ghost" id="b-again" type="button" data-t="again"></button>
  </section>

  <!-- HISTORY -->
  <section class="panel" id="v-history" hidden>
    <h2 data-t="historyTitle"></h2>
    <details class="guide" id="cal-h"><summary data-t="calTitle"></summary><div id="cal-h-body"></div></details>
    <div class="list" id="h-list"></div>
  </section>

  <!-- COACH -->
  <section class="panel" id="v-coach" hidden>
    <h2 data-t="coachTitle"></h2>
    <div class="stats">
      <div class="stat"><b id="c-days">0</b><span data-t="statDays"></span></div>
      <div class="stat"><b id="c-ontime">0</b><span data-t="statOnTime"></span></div>
      <div class="stat"><b id="c-bd">0</b><span data-t="statBd"></span></div>
    </div>
    <p class="note" data-t="coachNote"></p>
    <details class="guide" id="cal-c"><summary data-t="calTitle"></summary><div id="cal-c-body"></div></details>
    <div class="list" id="c-list"></div>
    <button class="btn ghost" id="b-clear" type="button" data-t="clearEx"></button>
  </section>

  <!-- COACH TOOLS (simple passcode gate) -->
  <section class="panel" id="v-tools" hidden>
    <h2 data-t="toolsTitle"></h2>
    <div id="tools-lock" style="display:contents">
      <p class="note" data-t="toolsLock"></p>
      <label><span data-t="qCode"></span><input id="f-code" type="password" inputmode="numeric" autocomplete="off"></label>
      <p class="status bd" id="code-msg" hidden></p>
      <button class="btn" id="b-code" type="button" data-t="unlock"></button>
    </div>
    <div id="tools-open" style="display:contents">
      <p class="note" data-t="toolsNote"></p>
      <div class="list" id="tools-list"></div>
      <button class="btn ghost" id="b-lock" type="button" data-t="lock"></button>
    </div>
  </section>
</div>

 th:{appName:"Deep Listening Training",tagline:"เกม 90 วัน · นั่งหลับตาวันละ 10 นาที · เล่นเพื่อเป็นคำพูด",

const synth=window.speechSynthesis;
function pickVoice(){
  if(!synth)return null;
  const want=lang==="th"?"th":"en";
  const vs=synth.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().replace("_","-").startsWith(want));

}

function say(text){
  if(!voiceOn)return;

  try{
    if(synth.speaking||synth.pending)synth.cancel();
    synth.resume();
    const u=new SpeechSynthesisUtterance(text);const v=pickVoice();
    u.lang=v?v.lang:(lang==="th"?"th-TH":"en-US");if(v)u.voice=v;
    u.rate=lang==="th"?0.9:0.95;u.volume=1;

    u.onstart=()=>{started=true;voiceMsg("")};
    u.onerror=()=>voiceMsg(v?T[lang].noSpeech:T[lang].noVoice);
    setTimeout(()=>synth.speak(u),60);
    setTimeout(()=>{if(!started)voiceMsg(v?T[lang].noSpeech:T[lang].noVoice)},2500);
  }catch(e){voiceMsg(T[lang].noSpeech)}
}

  const s=hm(session.started), e=hm(session.ended);
  session.actStart=s; session.actEnd=e;
  // demo mode only checks the start minute; real mode checks start and end, exact to the minute
  session.ontime=session.demo? s===session.declStart : (s===session.declStart && e===session.declEnd);
  answers={}; qi=0; stage="reflect"; showStatus(); show();
  showQ(false);
  say((full?T[lang].endSay+" ":"")+T[lang].q[0]);
}
function showStatus(){
  $("r-status").className="status"+(session.ontime?"":" bd");
  $("r-status-text").textContent=(session.ontime?T[lang].onTime:T[lang].bd)+`  (${session.declStart}–${session.declEnd} → ${session.actStart}–${session.actEnd})`;
}
/* ---- answer by voice (browser speech-to-text) ---- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,recOn=false;
function micUI(msg){$("b-mic").textContent=recOn?T[lang].micStop:T[lang].micStart;$("b-mic").setAttribute("aria-pressed",recOn);
  const m=$("mic-msg");m.textContent=msg||"";m.hidden=!msg}
function micStop(){if(rec){rec.onresult=null;try{rec.stop()}catch(e){}}recOn=false;micUI()}
$("b-mic").onclick=()=>{
  if(recOn){micStop();return}
  if(!SR){micUI(T[lang].micNo);return}
  try{synth?.cancel()}catch(e){}
  const ta=$("f-answer"),base=ta.value.trim()?ta.value.trim()+" ":"";let failed=false;
  rec=new SR();rec.lang=lang==="th"?"th-TH":"en-US";rec.continuous=false;rec.interimResults=true;
  rec.onresult=ev=>{let t="";for(let i=0;i<ev.results.length;i++)t+=ev.results[i][0].transcript;ta.value=base+t};
  rec.onerror=ev=>{if(ev.error!=="no-speech"&&ev.error!=="aborted")failed=true};
  rec.onend=()=>{recOn=false;micUI(failed?T[lang].micNo:"")};
  try{rec.start();recOn=true;micUI()}catch(e){micUI(T[lang].micNo)}
};
function showQ(speak=true){
  micStop();
  const n=FIELDS.length;
  $("r-steps").textContent=T[lang].step(qi+1,n);
  $("r-q").textContent=T[lang].q[qi];
  $("f-answer").value=answers[FIELDS[qi]]||"";
  $("b-prev").hidden=qi===0;
  $("b-next").textContent=qi===n-1?T[lang].save:T[lang].next;
  if(speak)say(T[lang].q[qi]);
}
$("b-replay-q").onclick=()=>say(T[lang].q[qi]);
$("b-prev").onclick=()=>{micStop();answers[FIELDS[qi]]=$("f-answer").value.trim();qi--;showQ()};
$("b-next").onclick=()=>{
  micStop();answers[FIELDS[qi]]=$("f-answer").value.trim();
  if(qi<FIELDS.length-1){qi++;showQ();return}
  entries.push({id:Date.now(),date:iso(new Date()),type:session.type,activity:session.activity,declStart:session.declStart,declEnd:session.declEnd,
    actStart:session.actStart,actEnd:session.actEnd,ontime:session.ontime,...answers});
  store.set(KEY,entries);
  session=null; stage="done"; show(); say(T[lang].doneTitle);
};
$("b-end").onclick=()=>finish(false);
$("b-again").onclick=()=>{stage="welcome";$("f-start").value=decl?decl.start:"";setStart();show()};
$("b-clear").onclick=()=>{entries=entries.filter(e=>!e.ex);store.set(KEY,entries);renderLists()};
$("b-voice").onclick=()=>{voiceOn=!voiceOn;if(!voiceOn)try{synth?.cancel()}catch(e){};store.set("dlt-voice",voiceOn);applyLang()};

function card(e,full){
  const t=T[lang], esc=s=>(s||"—").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  return `<article class="entry"><div class="head"><strong>${esc(e.activity)}</strong>
   <span>${e.ex?`<span class="chip ex">${t.example}</span> `:""}${e.type==="extra"?`<span class="chip ex">${t.gExtra}</span> `:""}<span class="chip ${e.ontime?"":"bd"}">${e.ontime?t.statOnTime:"break down"}</span></span></div>
   <div class="when">${e.date} · ${e.declStart}–${e.declEnd} → ${e.actStart}–${e.actEnd}</div>
   ${full?`<dl>${FIELDS.map((f,i)=>`<dt>${t.d[i]}</dt><dd>${esc(e[f])}</dd>`).join("")}</dl>`:`<div class="when">${t.d[4]}: ${esc(e.saw)}</div>`}
  </article>`;
}
function calHtml(){
  const t=T[lang],main=entries.filter(e=>(e.type||"main")==="main"),today=iso(new Date());
  const first=main.length?main.map(e=>e.date).sort()[0]:today,[y,m,dd]=first.split("-").map(Number);let h="";
  for(let i=0;i<90;i++){const d=iso(new Date(y,m-1,dd+i)),es=main.filter(e=>e.date===d);
    const c=es.some(e=>e.ontime)?"ok":es.length?"bdx":d<today?"miss":"fut";
    h+=`<span class="box ${c}${d===today?" now":""}" title="${d} · ${t.cal[c]}">${i+1}</span>`}
  return `<div class="grid90">${h}</div><div class="legend">${["ok","bdx","miss","fut"].map(c=>`<span><i class="box ${c}"></i>${t.cal[c]}</span>`).join("")}</div>`;
}
let toolsOpen=false;
function renderTools(){
  $("tools-lock").hidden=toolsOpen;$("tools-open").hidden=!toolsOpen;
  $("tools-list").innerHTML=TOOLS[lang].map((x,i)=>`<details class="guide"><summary>${x.t}</summary>${x.p.map(q=>`<p>${q}</p>`).join("")}
    <p><button class="replay" type="button" data-tool="${i}">${T[lang].listen}</button></p></details>`).join("");
}
$("tools-list").addEventListener("click",ev=>{const b=ev.target.closest("[data-tool]");if(!b)return;const x=TOOLS[lang][+b.dataset.tool];say(x.t+". "+x.p.join(" "))});
function tryCode(){const el=$("f-code"),ok=el.value.trim()==="9010";$("code-msg").hidden=ok;$("code-msg").textContent=ok?"":T[lang].codeBad;
  if(ok){toolsOpen=true;store.set("dlt-tools-open",true);el.value="";renderTools()}}
$("b-code").onclick=tryCode;$("f-code").addEventListener("keydown",ev=>{if(ev.key==="Enter")tryCode()});
$("b-lock").onclick=()=>{toolsOpen=false;store.set("dlt-tools-open",false);try{synth?.cancel()}catch(e){};renderTools()};
function renderLists(){
  renderTools();
  $("cal-h-body").innerHTML=$("cal-c-body").innerHTML=calHtml();
  const sorted=[...entries].sort((a,b)=>b.id-a.id), empty=`<p class="note">${T[lang].empty}</p>`;
  $("h-list").innerHTML=sorted.length?sorted.map(e=>card(e,false)).join(""):empty;
  $("c-list").innerHTML=sorted.length?sorted.map(e=>card(e,true)).join(""):empty;
  $("c-days").textContent=new Set(entries.filter(e=>(e.type||"main")==="main").map(e=>e.date)).size;
  $("c-ontime").textContent=entries.filter(e=>e.ontime).length;
  $("c-bd").textContent=entries.filter(e=>!e.ontime).length;
  $("b-clear").hidden=!entries.some(e=>e.ex);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{view=b.dataset.view;show()});
$("lang-th").onclick=()=>{lang="th";store.set("dlt-lang",lang);applyLang()};
$("lang-en").onclick=()=>{lang="en";store.set("dlt-lang",lang);applyLang()};
lang=store.get("dlt-lang","th"); voiceOn=store.get("dlt-voice",true);
decl=store.get("dlt-decl",null); toolsOpen=store.get("dlt-tools-open",false);
if(decl){gameType=decl.type==="extra"?"extra":"main";$("f-start").value=decl.start||"";$("f-alarm").value=decl.alarm||"";
  if(gameType==="extra"){$("f-min").value=decl.min;$("f-activity").value=decl.name}}
["h","c"].forEach(k=>{const el=$("cal-"+k);el.open=store.get("dlt-cal",false);
  el.addEventListener("toggle",()=>store.set("dlt-cal",el.open))});
setStart(); applyLang(); show();
</script>
</body>
</html>
