<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deep Listening Training</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&amp;family=Cormorant+Garamond:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#06241a}
a.btn{display:inline-block;text-decoration:none}
a.btn:hover{background:#ecc977}
</style>
</head>
<body>
<div style="min-height:100vh;box-sizing:border-box;padding:48px 24px;background:radial-gradient(ellipse at 50% 30%,#0f4a35 0%,#06241a 70%);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;font-family:'Noto Sans Thai',system-ui,sans-serif;color:#f4efe2">
<svg viewBox="0 0 600 600" style="position:absolute;left:50%;top:50%;width:min(1100px,150vw);transform:translate(-50%,-50%);opacity:.5;pointer-events:none" aria-hidden="true"><circle cx="300" cy="300" r="90" fill="none" stroke="#d9b45a" stroke-opacity="0.35"/><circle cx="300" cy="300" r="140" fill="none" stroke="#d9b45a" stroke-opacity="0.25"/><circle cx="300" cy="300" r="190" fill="none" stroke="#d9b45a" stroke-opacity="0.18"/><circle cx="300" cy="300" r="240" fill="none" stroke="#d9b45a" stroke-opacity="0.12"/><circle cx="300" cy="300" r="290" fill="none" stroke="#d9b45a" stroke-opacity="0.07"/></svg>
<div style="position:relative;width:100%;max-width:520px"><svg viewBox="0 0 440 160" width="100%" style="display:block" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d98b"/><stop offset="1" stop-color="#b98f33"/></linearGradient></defs><g id="bars"></g></svg></div>
<div style="position:relative;font-family:'Cormorant Garamond',serif;font-size:20px;letter-spacing:6px;color:#d9b45a;text-transform:uppercase">Deep Listening</div>
<h1 style="position:relative;margin:0;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(48px,9vw,96px);line-height:1.05;color:#f4efe2;max-width:900px">Deep Listening <span style="color:#d9b45a">Training</span></h1>
<p style="position:relative;margin:0;font-size:clamp(20px,3vw,28px);font-weight:300;color:#e8c872;max-width:640px;line-height:1.6">&ldquo;ฟังให้ได้ยินในสิ่งที่เขาไม่ได้พูด&rdquo;</p>
<div style="position:relative;width:72px;height:1px;background:#d9b45a"></div>
<p style="position:relative;margin:0;font-size:18px;line-height:1.9;color:#d9d6c8;max-width:560px">คนส่วนใหญ่มีแต่พูด ฟังไม่ได้<br>ที่นี่คุณจะได้ฝึกการฟัง และสิ่งแรกคือฟังตัวเองให้ได้ก่อน</p>
<a class="btn" href="trial.html" style="position:relative;margin-top:8px;padding:16px 44px;min-height:44px;box-sizing:border-box;border-radius:999px;background:#d9b45a;color:#06241a;font-size:20px;font-weight:600">มาเริ่มต้นกันเลย</a>
<div style="position:relative;font-size:15px;color:#b9b6a8">ทดลอง 7 วัน ฟรี</div>
</div>
<script>
(function(){var h=[10,18,30,22,46,70,38,92,58,120,76,150,96,120,76,92,58,70,38,46,22,30,18,10],s='';h.forEach(function(v,i){s+='<rect x="'+(i*18+4)+'" y="'+(80-v/2)+'" width="10" height="'+v+'" rx="5" fill="url(#gg)"/>';});document.getElementById('bars').innerHTML=s;})();
</script>
</body>
</html>
