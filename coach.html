<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deep Listening Training - Coach</title>
  <style>
    :root { --ink: #EAF5F1; --mut: #A9C5BD; --gold: #F5D98B; --on: #0B2A22; --line: rgba(255,255,255,.2); --card: rgba(255,255,255,.07); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(160deg, #0d1f1b 0%, #143229 55%, #1b4338 100%) fixed; color: var(--ink); font: 17px/1.65 'Noto Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 16px 18px 40px; }
    .back { display: inline-block; min-height: 44px; line-height: 44px; font-weight: 600; text-decoration: none; color: var(--gold); }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 18px; }
    .brand { margin: 0; font-size: 20px; font-weight: 700; color: var(--gold); }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .seg button { min-height: 44px; min-width: 52px; padding: 0 14px; border: 0; background: transparent; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
    .seg button.on { background: none; color: #8EE0CC; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 6px; }
    h2 { margin: 8px 0 14px; font-size: 24px; }
    .skill { margin: 0 0 12px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); font-size: 20px; font-weight: 600; }
    .btn { display: block; width: 100%; min-height: 52px; margin-top: 18px; padding: 10px 18px; border: 0; border-radius: 14px; background: var(--gold); color: var(--on); font: inherit; font-weight: 700; text-align: center; text-decoration: none; line-height: 32px; }
    :focus-visible { outline: 3px solid #8EE0CC; outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="trial.html" data-th="← กลับ" data-en="← Back">← กลับ</a>
    <div class="top">
      <h1 class="brand" translate="no">Deep Listening Training</h1>
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-l="th">ไทย</button>
        <button type="button" data-l="en">EN</button>
      </div>
    </div>
    <h2 data-th="สี่ทักษะของโค้ช" data-en="Four coach skills">สี่ทักษะของโค้ช</h2>
    <p class="skill" translate="no">Clearing</p>
    <p class="skill" translate="no">Sharing</p>
    <p class="skill" translate="no">Recreate</p>
    <p class="skill" translate="no">Leading</p>
    <a class="btn" href="manual.html" data-th="ไปที่คู่มือ" data-en="Go to the manual">ไปที่คู่มือ</a>
  </div>
  <script>
    (function () {
      var lang = 'th';
      try { lang = localStorage.getItem('dl_lang') === 'en' ? 'en' : 'th'; } catch (e) {}
      function apply() {
        document.documentElement.lang = lang;
        Array.prototype.forEach.call(document.querySelectorAll('[data-th]'), function (n) { n.textContent = n.getAttribute('data-' + lang); });
        Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) { b.classList.toggle('on', b.getAttribute('data-l') === lang); });
      }
      Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) {
        b.addEventListener('click', function () { lang = b.getAttribute('data-l'); try { localStorage.setItem('dl_lang', lang); } catch (e) {} apply(); });
      });
      apply();
    })();
  </script>
</body>
</html>
